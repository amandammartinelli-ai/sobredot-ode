# Configuração de deploy do frontend Sobredot no Netlify.
# A navegação usa router baseado em hash (#/rota), pelo que não é necessário
# nenhum redirecionamento de SPA para servir index.html em caminhos profundos.
# Ver docs/decisions.md para o registo desta decisão.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
